<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞萌DX 直播点歌器</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="app">
  <!-- 顶部标题栏 -->
  <header class="topbar">
    <div class="logo">
      <span class="logo-icon">♪</span>
      <span class="logo-text">舞萌DX 直播点歌器</span>
    </div>
    <div class="topbar-right">
      <button id="phoneAccessBtn" class="btn-link" title="手机扫码访问">手机访问</button>
      <a href="/list" target="_blank" class="btn-link">歌单列表页 ↗</a>
      <a href="/hot" target="_blank" class="btn-link">热门点歌榜 ↗</a>
      <a href="/live" target="_blank" class="btn-link">直播展示页 ↗</a>
    </div>
  </header>

  <!-- 手机访问弹窗 -->
  <div id="phoneModal" class="modal hidden">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>手机扫码访问</h2>
        <button id="closeModal" class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="qr-area">
          <img id="qrCode" src="" alt="QR Code" />
        </div>
        <p class="qr-hint">手机和电脑连接同一 WiFi，扫码或输入以下地址：</p>
        <div id="phoneUrls" class="phone-urls"></div>
      </div>
    </div>
  </div>

  <main class="layout">
    <!-- 左栏：直播嵌入 + 搜索 -->
    <section class="left-panel">
      <!-- 直播间嵌入 -->
      <div class="card stream-card">
        <div class="card-header">
          <h2>直播间</h2>
          <div class="stream-input-group">
            <input type="text" id="streamUrl" class="input" placeholder="粘贴直播间/弹幕页面链接…" />
            <button id="loadStream" class="btn btn-primary">加载</button>
          </div>
        </div>
        <div class="iframe-wrapper" id="iframeWrapper">
          <iframe id="streamFrame" src="about:blank" frameborder="0" allowfullscreen></iframe>
          <div class="iframe-placeholder" id="iframePlaceholder">
            <p>在上方输入链接后点击「加载」</p>
            <p class="hint">支持弹幕页面、直播间聊天等</p>
          </div>
        </div>
      </div>

      <!-- 搜索区域 -->
      <div class="card search-card">
        <div class="search-bar">
          <input type="text" id="searchInput" class="search-input" placeholder="输入歌名或别名搜索…" autocomplete="off" />
          <button id="searchBtn" class="btn btn-primary">搜索</button>
        </div>
        <div id="searchResults" class="search-results">
          <div class="empty-hint">输入关键词开始搜索</div>
        </div>
      </div>
    </section>

    <!-- 右栏：歌单管理 -->
    <section class="right-panel">
      <div class="card playlist-card">
        <div class="card-header">
          <h2>当前歌单</h2>
          <div class="playlist-controls">
            <button id="prevBtn" class="btn btn-sm" title="上一首">◀ 上一首</button>
            <button id="nextBtn" class="btn btn-sm" title="下一首">下一首 ▶</button>
            <button id="pauseBtn" class="btn btn-sm" title="暂停当前歌曲">暂停</button>
            <button id="clearBtn" class="btn btn-sm btn-danger" title="清空">清空</button>
          </div>
        </div>
        <div id="playlistView" class="playlist-view">
          <div class="empty-hint">歌单为空，从左侧搜索添加歌曲</div>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
